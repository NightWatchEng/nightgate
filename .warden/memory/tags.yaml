# ── THE DRIFT CEILING (agentops-92z) ───────────────────────────────────────
#
# The reconcile above was the third done reactively: 4 undeclared, then 6,
# then 26, with nothing open against it in between. The detector worked the
# whole time - `warden memory stats` printed the names on every run. What was
# missing was an obligation to answer them, so the count grew until an audit
# happened to look. This is that obligation, in the shape
# `.warden/catalog-answers.yaml` already uses for the guardrail gap.
#
# WHAT IT COUNTS: names in the corpus with NO recorded disposition - neither
# declared, nor folded, nor written down above. Not the count of undeclared
# names at the declaration bar, which is what this change first tried: the
# round-1 review refuted that with the corpus itself. Five of the EIGHT at-bar
# classes were coined in the three days before this reconcile, and one single
# review round (shard 20260830T161436Z) took `guard-narrower-than-claim` from
# 0 to 4 judged and `thin-sample-verdict` from 0 to 3 - two brand-new names
# past the bar together. Bounding that count would force a taxonomy argument
# inside the very PR that coined them, against this file's own governance
# ("a new class must be nameable the moment it is found"), and its cheapest
# green is to reuse a near-enough declared tag: the split-recall harm,
# inverted. It also left the number the bead actually cites bounded by
# nothing.
#
# Clearing an UNDECIDED entry costs one line and decides nothing about the
# class - "n=1, coined this round, watching" is a receipt, not a judgment. So
# the ceiling can sit at 0 with no ratchet pressure, and the silence that let
# 4 become 26 is the thing that becomes impossible.
#
# WHERE IT REDDENS: `tests/test_tag_vocabulary_guards.py::
# test_this_repos_tag_ceiling_is_declared_and_holds` fails the suite, and the
# suite runs on `pull_request` as well as `push` - so a branch whose review
# round coins a name goes red in its OWN CI, at the moment the receipt is
# cheapest to write. `warden memory ingest` REPORTS a breach on stderr and in
# `ingest-result.json` - NOT in the run manifest, which carries no ceiling
# field - and still exits 0, deliberately: `cage/run.sh` gates publishing
# the run's attest shard on that exit code and would discard the evidence of
# the very round that coined the name, and `retro/SKILL.md` reads a non-zero
# there as "the corpus is unread" and would halt the ritual that clears the
# breach.
#
# Raising the number is a deliberate human edit and needs a rationale arguing
# for the NEW value; the guard test pins the value itself, so a bump that
# leaves this paragraph untouched goes red rather than passing quietly.
ceiling:
  max_undecided: 0
  rationale: >-
    Zero, set 2026-09-01 (agentops-92z), because the obligation this bounds is
    a receipt rather than a decision: every name in the corpus is declared,
    folded, or written down above with a reason, and adding the next one costs
    a single line that commits its author to nothing about the class. There is
    no honest argument for a backlog of names nobody has written a sentence
    about - that backlog is exactly what went 4 to 6 to 26 unnoticed. Raise it
    only by recording why a name cannot be given even a one-line receipt, and
    replace this paragraph when you do.
