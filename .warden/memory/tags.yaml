# The declared defect-class vocabulary for this repo.
#
# Tags are a recall KEY: two names for one class split the index and the
# recall that should have fired never does. Unknown tags WARN rather than
# fail — a new class must be nameable the moment it is found — and the retro
# proposes additions, merges, and removals like any other policy edit.
#
# Name the DEFECT CLASS, never the file. Two to four words, kebab-case.
tags:
  fail-open: a check that errs toward passing instead of blocking when it cannot evaluate
  enforcement-claim: a comment, doc, or message asserting a check that does not exist
  docs-drift: documentation describing behavior the code no longer has
  policy-enforcement-gap: a rule declared but wired to nothing that can reject
  false-positive: a rule firing on something it was never meant to catch
  self-reference: a check flagging its own definition or documentation
  policy-contract: a declared contract between a skill and the repo it runs in
  graph-fidelity: the declared topology diverging from the loop that actually runs
  cage: a hard stop, its budget, or its enforcement boundary
  # Adopted by the 2026-08-24 retro (agentops-a5p.12): each was coined
  # honestly in review and reconciled here — the soft-governance loop working.
  test-cannot-fail: a test or guard that passes no matter what the code under it does
  test-hermeticity: a test coupled to state outside its own setup
  test-ordering-race: a test whose outcome depends on the order its neighbors run in
  wall-clock-dependence: logic or a test keyed to the real clock, breaking on date boundaries or slow runs
  corpus-integrity: the review corpus or its evidence chain corrupted, colliding, or silently dropping records
  diagnosability: a failure that reports nothing actionable about its cause
  # Adopted by the 2026-08-29 retro (agentops-a5p.17.7). Each cleared the
  # declaration bar — 3+ judged records in the committed shards, upheld more
  # often than not — re-derived from the corpus on the day, not from the
  # proposal's two-day-old citation. tests/test_tag_vocabulary_guards.py
  # re-derives the floor from the shards on every run.
  #
  # 27 judged, 27 upheld — 7th-largest class in the TAG index. The 2026-08-26
  # proposal cited n=1 and asked to MERGE this name into false-positive; three
  # days later it is the CANDIDATE index's fourth-largest class (10 judged under
  # `unmapped:overbroad-pattern`) and the declared rule `pattern-fit` covers it,
  # with `unmapped:overbroad-pattern` grandfathered in .warden/certification.yaml.
  # The merge is refused and the name is declared instead: an alias would fold
  # `unmapped:overbroad-pattern` to `unmapped:false-positive` at every read
  # seam, detaching ten judged records from the rule they justify.
  overbroad-pattern: a rule or pattern matching what it was never meant to catch
  # 3 judged, 3 upheld. Cited at n=2 by the proposal.
  breaking-consumer-migration: a change that breaks a pinned consumer's migration path
  # 3 judged, 3 upheld. Cited at n=1 by the proposal; two of the three landed
  # on rule bodies in .warden/rules/ — a rule body miscrediting the corpus
  # record it draws on is this class, and the corpus is the only thing that
  # can catch it.
  evidence-attribution: evidence cited to a source or actor that does not support it
  # Declared to close agentops-zh9: `rename-complete` already files findings
  # under this class via `covers:`, so ingest warned on the rule's own name
  # and reviewers had no declared key to reuse — the split-recall failure the
  # header above warns about. tests/test_tag_vocabulary_guards.py now derives
  # every covers: slug and refuses an undeclared one. (The bead also named
  # overbroad-pattern; the a5p.17.7 retro declared it first, above.)
  incomplete-rename: a rename that misses surfaces still naming the old thing
  # ── The 2026-09-01 reconcile (agentops-92z) ──────────────────────────────
  # 26 undeclared names when the reconcile began, after 4 (a5p.12) and 6
  # (a5p.17.7). Each of the 26 was DECIDED: 7 declared here, 3 folded under
  # `aliases:`, 16 recorded under `left_undeclared:` at the foot of this file.
  # Then merging origin/main mid-branch brought a review round that coined FIVE
  # MORE, and the ceiling went red on the merge commit until each had a receipt
  # — the mechanism catching its first real drift rather than a miscount. So
  # the totals a reader measures today are 31 names decided, of which 21 sit in
  # `left_undeclared:`, not 26 and 16.
  #
  # Every decision was taken by reading the records behind the name, never by
  # name similarity, and every count below is "as of 2026-09-01" — `memory
  # stats` re-derives them from the shards on every run, which is the only
  # reading that cannot rot.
  #
  # 3 judged, 3 upheld. NOT diagnosability, which is "reports nothing
  # actionable": these three messages report something the run did not do — a
  # two-dot range printed for a three-dot check, a note asserting a path the
  # code returns before, a refusal asserting a reopening that did not happen.
  # A reader who acts on them is sent somewhere real and wrong, which is the
  # more expensive failure. Fold onto diagnosability is refused anyway:
  # `error-names-cause` covers: it, so an alias would detach that rule's
  # committed evidence.
  ambiguous-diagnostic: a diagnostic that states something the run did not do
  # 3 judged, 3 upheld, one of the three arriving by the instruction-conflict
  # fold below. Doc-versus-DOC, where docs-drift is doc-versus-code: a skill
  # that mandates and forbids the same prompt text, a wiki page disagreeing
  # with itself 70 lines apart, a policy whose machine tier writes exactly
  # where its own forbidden-paths section bars every agent. The reader cannot
  # comply with both and nothing in the tree can tell them which wins.
  contradictory-guidance: two authoritative statements that cannot both be followed
  # 7 judged, 7 upheld — the largest undeclared class in this reconcile, and
  # distinct from test-cannot-fail, which is a guard that passes NO MATTER
  # WHAT. These guards do fail — on inputs that were never the point: a cap
  # test holding ruleset size at 1 when the length scales with ruleset size, a
  # truncation guard parametrised at the two safe points either side of the
  # broken band, a byte-identity claim asserting only the absence of an
  # ellipsis. Fold onto test-cannot-fail is refused anyway (`tests-bite`
  # covers: it), and it would lose the distinction that makes this class
  # findable: the coverage is narrow, not absent.
  guard-narrower-than-claim: a guard whose real coverage is narrower than the claim it carries
  # 4 judged, 4 upheld, all four filed under the rule of the same name. The
  # rule `lang-conventions` declares no `covers:`, so the class it enforces
  # had no declared tag and reviewers filed under the rule's own id — the
  # agentops-zh9 shape, reached from the other direction. Declared rather than
  # answered with a `covers:` line because a covers: slug equal to a rule id
  # shadows the very history that justifies the rule (the corpus's own rule
  # for writing one). Sharing the name with a rule costs nothing: it only
  # bars the name from ever being an alias side, which is correct.
  lang-conventions: code departing from the conventions of the code around it
  # 5 judged, 4 upheld. Not overbroad-pattern, which is about a PATTERN
  # matching too much: this is a CHANGE quietly enlarging what something
  # covers or affects — one suppression marker silencing two rules that
  # happened to share a check id, a pause gaining the power to fail a command
  # while the surfaces promising the opposite went untouched.
  # Stated honestly: only those two of the five are squarely this class. The
  # other three (a coverage spec with no completeness assertion; a shipped
  # example left on old action shas; one number read as both trigger and
  # suppressor) are looser members, two of them already carrying a sharper
  # tag. The declaration stands on the whole set (5 judged, 4 upheld), but its
  # boundary is wider in the corpus than the description above, and a reviewer
  # filing here should say why. Deliberately no arithmetic on the stripped
  # subset: the first draft asserted one, and the number was unreachable under
  # either reading of which three to strip (round-2 cross-examination, N7).
  silent-scope-widening: a change that widens what something covers or affects without saying so
  # 4 judged, 3 upheld. The code's own comment or docstring describing a
  # design the code no longer has — a retired ordering key still explaining
  # the call whose ordering changed, a comment describing a refusal the same
  # commit had already softened to a warning. Not docs-drift: a different
  # surface, and `wiki-fidelity` covers that class, so the fold is refused.
  # Nor is it incomplete-rename — though three of the four records DO carry
  # that tag and file under `rename-complete`, which is the honest state of
  # the evidence: the reviewers who coined this name read these as renames
  # that missed a surface, and the distinction being drawn here (the design
  # was replaced, not renamed) is finer than the corpus yet supports. Declared
  # rather than folded because `incomplete-rename` is covered by
  # `rename-complete` and cannot be a fold target at all; re-read at the next
  # reconcile if the two keep arriving together.
  stale-self-description: a comment or docstring describing a design its own code no longer has
  # 5 judged, 4 upheld. Kept SEPARATE from guard-narrower-than-claim
  # deliberately: two of these records carry BOTH tags, so the reviewers who
  # coined them saw two aspects of one finding rather than two spellings of
  # one class, and an alias would delete the distinction at read time. The
  # narrowness is the guard's; the thinness is the VERDICT's — a dry run
  # measured against bare disk while the real loop is cumulative, a review
  # claim made without reading eight lines further down the file.
  thin-sample-verdict: a verdict drawn from a sample too narrow to support it
  # ── The 2026-09-20 re-read (agentops-elsx.4.6) ───────────────────────────
  # Four receipts in `left_undeclared:` recorded counts their evidence had
  # outgrown, and `memory stats` had been printing all four on its UNDECLARED
  # AT THE DECLARATION BAR line — which is exactly the re-read list that line
  # exists to produce, working. Each was re-decided by reading the RECORDS
  # behind the name, never the name, and each supersedes its receipt through a
  # decision shard under `.warden/memory/decide/` (agentops-elsx.4.6) rather
  # than by quiet rewrite. Counts and round spread below are as of 2026-09-20
  # over the committed shards; `memory stats` re-derives them on every run,
  # which is the only reading that cannot rot.
  #
  # None of the four is a rule id and none is a class any rule `covers:`, so
  # declaring moves no committed evidence between rules and no candidate row
  # across any bar — measured before the edit, which is the check the
  # `unwired-gate` receipt below shows is the one that matters.
  #
  # 4 judged, 4 upheld, across THREE rounds (2026-08-30, 2026-09-02,
  # 2026-09-03). The receipt read "n=1 ... one record is not enough to coin
  # one"; four records from three separate rounds are, and the shape is
  # consistent across them: a warning naming two rules as though its list
  # closed when the corpus instance that justified the ruling was neither, two
  # docstrings closing a residual list over a silence they do not hold, and a
  # retro instruction giving ONE cause for a line that has two. Not
  # `diagnosability`, which is "reports nothing actionable" — these do report,
  # and the report is short by an item it implies it holds. That fold is
  # refused anyway: `error-names-cause` covers that class.
  incomplete-cause-list: a stated list of causes or residuals that omits one it implies is complete
  # 4 judged, 4 upheld, across TWO rounds (2026-09-01, 2026-09-02). The
  # receipt read "n=2 ... below the bar either way"; the bar is met now. All
  # four file under declared rules (`pattern-fit` x3, `fail-closed` x1), so
  # nothing is orphaned and no candidate row moves. The fold onto
  # `overbroad-pattern` the receipt weighed stays refused — `pattern-fit`
  # covers that class — so declaring is the only disposition left, and it is
  # the right one: this names the MECHANISM (the pattern omits the predicate
  # that identifies its subject: `npm init -y` read as an unpinned repo start,
  # a `$` anchor matching before a trailing newline) where overbroad-pattern
  # names the effect. Two rounds and not one, so the single-round caveat that
  # still holds `scope-limited-derivation` below does not apply here.
  unanchored-pattern: a pattern matching without requiring the thing that identifies its subject
  # 3 judged, 3 upheld, across THREE rounds (2026-08-27 x2, 2026-09-02). The
  # receipt read "below the bar either way"; it is at the bar now, and the
  # rest of that receipt is carried forward unchanged because it is still the
  # argument: nearest is `guard-narrower-than-claim`, declared above and
  # unshadowed, and these guards are not merely narrow but EMPTY — a rationale
  # check that took any non-blank string, a "reason is REQUIRED" that accepted
  # `.`, a SILENT case whose pattern never matches its own subject. That is
  # the line drawn in that class's own description. The fold onto
  # `test-cannot-fail` is refused anyway: `tests-bite` covers it.
  vacuous-guard: a check that accepts anything, so nothing can fail it
  # 3 judged, 2 upheld, 1 refuted, across THREE rounds (2026-08-27 x2,
  # 2026-09-03) — upheld more often than not, which is the bar. The receipt
  # called it "a real and sharp class, simply not yet at the declaration bar",
  # so the count was its whole reservation and the count has moved. The
  # refutation is read and kept: it refuted a FINDING (two artifacts carrying
  # a `total_records` key with two meanings) on the ground that the
  # cross-check it cited compares something else — not the class, which the
  # two upheld records hold squarely: one file read through two loaders
  # enforcing contradictory contracts, and a docstring claiming the bar its
  # own implementation did not apply.
  reader-divergence: two readers of one artifact applying contradictory contracts
  # Declared because blast-radius-named `covers:` it (agentops-zh9's
  # reasoning, as for incomplete-rename above): a covered slug missing from
  # this vocabulary makes ingest warn on the rule's own name. The class is the
  # charter lens of the same id; its findings file under the rule now.
  # `breaking-consumer-migration` above names a narrower slice of the same
  # class and is left as it is: folding it here means covering it, which
  # refuses the `consumer-contract` alias that targets it, and that is a
  # retro's decision with its own receipt, not this rule's.
  consumer-blast-radius: a change that breaks what a pinned or enrolled consumer already runs or reads

# A merged name: shards keep the historical tag, every index folds it into
# the canonical key at read time. Append here when the retro merges a class;
# never rewrite a shard.
#
# AN ALIAS IS THE ONE EDIT HERE THAT REWRITES WHAT READERS SEE.
# `canonicalize_records` folds `unmapped:<slug>` rule ids through this same
# table, so an alias whose NAME or TARGET is a declared rule id or a
# `covers:` class would silently move committed evidence between rules.
# Two guards refuse that shape (agentops-a5p.15): `_split_aliases` resolves
# the repo's declared `review.rules_dir` from the root and refuses a
# colliding alias at every read seam, and
# tests/test_tag_vocabulary_guards.py is the independent second reading.
aliases:
  # Coined during agentops-daq.2; the coining agent itself judged it the same
  # class as wall-clock-dependence. A split key splits recall (a5p.12 retro).
  test-determinism: wall-clock-dependence
  # ── The 2026-09-01 reconcile (agentops-92z) ──────────────────────────────
  # Three folds, each taken on the record behind the name and each stated with
  # what it moves. Two of the three carry an `unmapped:` rule id, so the fold
  # moves candidate evidence as well as tag evidence — measured before and
  # after, and reported on the PR:
  #
  # 1 record (skills/.../pre-pr-review/SKILL.md, HIGH, fixed): the skill pack
  # ships from the default branch while consumers pin a warden VERSION, so a
  # consumer on the pin reads the new protocol and calls a warden that refuses
  # it. That is a pinned consumer's migration path breaking, which is the
  # declared class verbatim. Its rule_id is the declared rule
  # `enforcement-truth`, which never folds, so no candidate row moves.
  consumer-contract: breaking-consumer-migration
  # 1 record carries this TAG (.warden/skills-policy.md, MEDIUM, fixed): the
  # machine tier writes under .warden/ while the same policy's forbidden-paths
  # section bars every agent from it. Two authoritative statements that cannot
  # both be followed — the class declared above, whose other two records were
  # coined as `contradictory-guidance`. Three records, two spellings: the
  # split this file's header warns about.
  #
  # The tag and rule namespaces do not line up here, and the fold moves both.
  # The tagged record's own rule_id is `unmapped:machine-tier-contradicts-
  # forbidden-paths`, which does NOT fold. What folds is a DIFFERENT record —
  # skills/.../pre-pr-review/SKILL.md:92, one of the two already tagged
  # `contradictory-guidance` — whose rule_id is `unmapped:instruction-
  # conflict` (1 judged, 1 upheld). It lands on
  # `unmapped:contradictory-guidance`, taking that row 1 -> 2 judged: two
  # watching rows become one, still under the 3-judged candidate proposal bar,
  # so no candidate changes side of any bar. The fold is better than it looks
  # — it puts that record's candidate row on the class its own tag names.
  instruction-conflict: contradictory-guidance
  # `unsupported-source-claim: evidence-attribution` stood here from
  # 2026-09-01 until the `attribution-holds` rule covered that class. A
  # covered class enters the RULE namespace, so the loader now refuses this
  # fold — it would write `unmapped:evidence-attribution`, a key `attest
  # write` refuses — and a refused alias left in this block is dead config
  # reading as a live merge. The entry moved to a `left_undeclared:` receipt
  # below rather than being deleted quietly; the receipt carries the record
  # and the reason.

# ── DECIDED, AND DELIBERATELY LEFT UNDECLARED (agentops-92z, 2026-09-01) ────
#
# The third disposition, beside `tags:` and `aliases:`. Each name here was
# read, and each records WHY it is neither declared nor folded —
# machine-readable, because the first draft of this reconcile wrote these as
# comments, and a decision the next reconciler has to re-derive by hand is how
# the count reached 26 in the first place.
#
# TWO of these entries are AT the declaration bar (3+ judged, upheld more often
# than not) and left anyway, each for the reason recorded against it:
# `unwired-gate` and `scope-limited-derivation`. Every other entry sits below
# the bar. Do not take a count from this paragraph — `memory stats` prints the
# at-bar names on every run and that line is the authority; this sentence has
# already gone stale once, when five entries were appended beneath an unchanged
# header (round-2 cross-examination, N2). Declaring a sub-bar name would pad
# the vocabulary with names one round coined and nothing reused; folding one on
# a guess is the merge this file's own history refuses (a5p.17.7, on n=1).
#
# Counts are "as of 2026-09-01". `memory stats` re-derives them from the
# shards on every run, and prints an UNDECLARED AT THE DECLARATION BAR line
# naming the entries here whose evidence has outgrown the reason below — that
# line is the retro's re-read list.
#
# That line has been acted on once: on 2026-09-20 (agentops-elsx.4.6) four
# entries it named — `incomplete-cause-list`, `unanchored-pattern`,
# `vacuous-guard` and `reader-divergence` — were re-read against their records
# and DECLARED in `tags:` above, each superseding its receipt through a
# decision shard rather than a quiet rewrite. Their receipts are gone from
# this block because the decision they recorded no longer stands; the shards
# and the comments above `tags:` carry what they said and why it changed. The
# two-entries-at-the-bar sentence above is true again as a result, and it is
# still not a count to take from this paragraph.
#
# A RECEIPT THAT NAMES A CONDITION FOR RE-READING ITSELF IS NOW HELD TO IT,
# wherever it sits. The at-bar line catches a decision the corpus has outgrown
# numerically and only for a name it names; the correction that prompted this
# was neither — a sub-bar receipt whose own words said "fold it when another
# record lands", and the record had landed. A stated trigger is the premise
# the writer chose, so a fired one is a decision that has stopped being one.
# THE CONDITION LIVES IN ONE KEY, NEVER IN PROSE (agentops-elsx.18). A
# receipt that sets one is a mapping — `reason:` beside `trigger:`, which
# carries any of `judged_at_least: N`, `upheld_at_least: N` and
# `rule_live: <rule id>` and fires when ANY is met — and `trigger: none` says
# its words state no condition. `warden/tags.py` parses the key for `memory
# check-vocabulary` and for tests/test_tag_vocabulary_guards.py alike, which
# evaluates it against the committed shards and the live ruleset. Nothing
# reads a condition out of the reason: the reader that tried enumerated
# phrasings, and every review round found more it could not see. So a plain
# receipt whose words pair a re-read verb with a number or a backticked name,
# or name a future count ("a second occurrence"), is REFUSED and the key
# named — a false refusal costs one line, a false pass is a condition nothing
# evaluates. That refusal is the whole reach: a condition worded with neither
# is not seen, so the rule above is held by the writer, and by the refusal
# only as far as its two shapes go. Its first run found one it could see and
# no reader had: `fix-without-test`, whose second occurrence had landed.
left_undeclared:
  unsupported-source-claim:
    trigger: {rule_live: attribution-holds}
    reason: >-
      n=5, AT the declaration bar. Recorded at n=2, whose named record was
      warden/guardrails/catalog.yaml, MEDIUM, fixed: a header claiming the
      cited page lists ten reviewer lenses where it lists twelve. Folded onto
      `evidence-attribution` from 2026-09-01 until the rule `attribution-holds`
      covered that class. A covered class is in the rule namespace, so the
      loader refuses the fold - it would write `unmapped:evidence-attribution`,
      which `attest write` refuses - and a refused alias left in that block is
      dead config reading as a live merge, so the entry moved here instead of
      being deleted without a word. Declaring the name is the split-recall
      failure this file's header warns about: it is the same class, under the
      name one round coined for it. Its one record therefore no longer counts
      toward the candidate row, which is why the promote artifact derives 32
      judged where a pre-rule `memory stats` printed 33 - the artifact is
      derived after the refusal, never before it. Re-read if that rule is ever
      paused or retired, either of which re-opens the fold.
      RE-ARGUED at 5 judged, 4 upheld, and the
      disposition is unchanged - strengthened, if anything. The three records
      that carried it here came from the two rounds that reviewed this very
      entry's own branch: a figure filed under a header stating a condition it
      was not measured under, a cost inferred from a measurement while the
      sentence claimed both were measured, and - after the first was repaired -
      the same record pairing figures from two different RUNS without saying so.
      All three are squarely the class - a claim citing evidence that does not
      support it - and the third is the sharpest argument this receipt has for
      the class being real, since it is the same defect surviving its own
      correction one level in. Which is exactly why declaring is still refused. `attribution-holds` covers that class, so a second declared
      name for it is verbatim the split-recall failure this file's header warns
      about, and the fold this entry records stays mechanically refused. Being
      at the bar does not change either fact: the bar decides whether a name has
      earned a DECISION, and the decision it earned is this one.
  false-attribution:
    trigger: {judged_at_least: 3}
    reason: >-
      n=2. Nearest available fold is `ambiguous-diagnostic`, declared above and
      NOT shadowed by any rule, so the fold is mechanically open — and one of
      the two records already carries both tags. Left split for the same reason
      `thin-sample-verdict` is kept apart from `guard-narrower-than-claim`: a
      record carrying both names is a reviewer drawing a distinction, and an
      alias would erase it at read time. At n=2 nothing is forced; revisit when
      a third record says which way it goes.
  silent-failure: >-
    n=2. Both records already carry `fail-open` or `test-hermeticity`, so no
    evidence is orphaned, and the name is broad enough that declaring it would
    attract records belonging to sharper classes. The fold onto `fail-open` is
    refused anyway - `fail-closed` covers it.
  silent-obligation: >-
    n=2. An obligation stated with nothing tracking it. One of the two records
    carries the `enforcement-claim` TAG; both file under the rule
    `enforcement-truth`, which covers that class, so neither is orphaned.
  unclear-error: >-
    n=2, and the two records split across two different classes - one is plain
    `diagnosability` (a traceback naming `.get` rather than the cause), one is
    `ambiguous-diagnostic` (a refusal stating something false). Any single
    fold would misfile the other, and `diagnosability` is covered by
    `error-names-cause` so that half cannot be folded at all.
  catalog-starter-fail-open: >-
    n=1, and the record already carries `fail-open`, so nothing is orphaned.
    The fold onto `fail-open` is refused: `fail-closed` covers that class.
  unenforced-seam: >-
    n=1, and the record already carries `fail-open`, so nothing is orphaned.
    The fold onto `fail-open` is refused: `fail-closed` covers that class.
  unfalsifiable-waiver: >-
    n=1, and the record already carries `fail-open`, so nothing is orphaned.
    The fold onto `fail-open` is refused: `fail-closed` covers that class.
  continue-after-failed-step: >-
    n=1. An ordered, state-mutating pipeline continuing past a failed step.
    The coining reviewer said outright that no declared class covers
    halt-ordering; nothing has joined it since.
  handoff-contract-skew:
    trigger: none
    reason: >-
      n=2 as a TAG, but `unmapped:handoff-contract-skew` carries 8 judged
      records (6 upheld) and is a PROPOSE RULE row. That asymmetry is the reason
      to leave it: any fold of this NAME drags the candidate row with it, so the
      decision belongs to whoever decides the rule, not to a reconcile. Counts
      re-read from the shards 2026-09-21 (agentops-itjp); they were stated as
      n=1 and 5 judged, and the argument is unchanged by the correction — still
      below the 3-judged bar as a tag, still a candidate row a fold would move.
  over-fix: >-
    n=1. A repair that went further than the defect required. No declared
    class it plainly is, and one record is not enough to coin one.
  unwired-provenance-field:
    trigger: none
    reason: >-
      n=1. A signal written to stderr and discarded rather than carried in the
      artifact. Its record already carries `silent-obligation`, itself left
      below; revisit both together.
  defensive-dead-branch: >-
    n=1, and that single record is dismissed-with-reason, so there is no
    upheld evidence at all. Declaring on a dismissal would be the weakest
    possible ground for a name.
  unwired-gate:
    trigger: {upheld_at_least: 3}
    reason: >-
      n=3, AT the declaration bar (3 judged, 2 upheld) and left anyway, which is
      the one entry here that needs its argument read. Its three records are not
      one class: the two UPHELD ones are test-coverage gaps already carrying
      `test-cannot-fail` (a regression suite driving the API instead of the CLI
      that held the defect; a fix shipped with no test at all), and only the
      DISMISSED one is a policy-enforcement gap. Declaring would mint a name for
      a bag. Folding into `policy-enforcement-gap` would drag
      `unmapped:unwired-gate` (1 judged, 0 upheld) onto
      `unmapped:policy-enforcement-gap` (3 judged, 2 upheld), taking it to 4
