# The declared defect-class vocabulary. The annotated copy, with each name's
# history and receipts, lives in the private repository.
tags:
  fail-open: a check that errs toward passing instead of blocking when it cannot evaluate
  enforcement-claim: a comment, doc, or message asserting a check that does not exist
  docs-drift: documentation describing behavior the code no longer has
  policy-enforcement-gap: a rule declared but wired to nothing that can reject
  false-positive: a rule firing on something it was never meant to catch
  self-reference: a check flagging its own definition or documentation
  policy-contract: a declared contract between a skill and the repo it runs in
  graph-fidelity: the declared topology diverging from the loop that actually runs
  cage: a hard stop, its budget, or its enforcement boundary
  test-cannot-fail: a test or guard that passes no matter what the code under it does
  test-hermeticity: a test coupled to state outside its own setup
  test-ordering-race: a test whose outcome depends on the order its neighbors run in
  wall-clock-dependence: logic or a test keyed to the real clock, breaking on date boundaries or slow runs
  corpus-integrity: the review corpus or its evidence chain corrupted, colliding, or silently dropping records
  diagnosability: a failure that reports nothing actionable about its cause
  overbroad-pattern: a rule or pattern matching what it was never meant to catch
  breaking-consumer-migration: a change that breaks a pinned consumer's migration path
  evidence-attribution: evidence cited to a source or actor that does not support it
  incomplete-rename: a rename that misses surfaces still naming the old thing
  ambiguous-diagnostic: a diagnostic that states something the run did not do
  contradictory-guidance: two authoritative statements that cannot both be followed
  guard-narrower-than-claim: a guard whose real coverage is narrower than the claim it carries
  lang-conventions: code departing from the conventions of the code around it
  silent-scope-widening: a change that widens what something covers or affects without saying so
  stale-self-description: a comment or docstring describing a design its own code no longer has
  thin-sample-verdict: a verdict drawn from a sample too narrow to support it
  incomplete-cause-list: a stated list of causes or residuals that omits one it implies is complete
  unanchored-pattern: a pattern matching without requiring the thing that identifies its subject
  vacuous-guard: a check that accepts anything, so nothing can fail it
  reader-divergence: two readers of one artifact applying contradictory contracts
  consumer-blast-radius: a change that breaks what a pinned or enrolled consumer already runs or reads
aliases:
  test-determinism: wall-clock-dependence
  consumer-contract: breaking-consumer-migration
  instruction-conflict: contradictory-guidance
