  # the corpus's own proposal bar. Same reasoning as fail-open, same
  # deliberate act: each list entry below is the frozen evidence that
  # justified its rule. tests/test_corpus_rules.py re-derives the backtest
  # artifacts' count FIELDS from the shards on every run; the figures in
